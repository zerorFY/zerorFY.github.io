<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
  <meta name="aiq-api" content="https://zeror-aiq.vzobole.chatgpt.site">
  <meta name="description" content="面向自雇 AI 新人的讲座问卷：三人一起提问题、评优先级，把讲座做得更有用。">
  <title>AIQ · AI 讲座问卷共创</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='14' fill='%23255249'/%3E%3Ctext x='24' y='33' fill='%23fff' font-size='27' text-anchor='middle' font-family='sans-serif'%3E问%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./compact.css?v=20261019-3"><script src="./app.js?v=20261019-3" defer></script>
</head>
<body>
<header class="topbar"><a class="brand" href="./" aria-label="AIQ 问卷共创首页"><span class="brand-icon">Z<span>·</span></span><span>zeror<span class="brand-divider">/</span><strong>aiq</strong></span></a><span class="private-label"><span class="dot"></span>问卷共创</span><button id="share" class="quiet">分享 <span aria-hidden="true">↗</span></button></header>
<main>
  <div id="workspace">
    <section class="collaboration" aria-label="参与者与评分进度"><div class="choose-label"><strong>评分人</strong></div><div id="members" class="members"></div><div class="sync"><span id="sync-dot" class="dot"></span><span id="sync-status" role="status">正在连接…</span><button id="refresh" class="icon-button" title="刷新共享数据" aria-label="刷新共享数据">↻</button></div></section>
    <section class="board" aria-labelledby="board-title"><div class="board-heading"><div><h1 id="board-title">问卷选题 <span id="total" class="count">0</span></h1></div><div class="board-actions"><details class="export-menu"><summary class="quiet">导出 ↓</summary><div><button data-export="csv">导出评分表 CSV</button><button data-export="json">备份完整数据 JSON</button></div></details><button id="add" class="primary"><span aria-hidden="true">＋</span> 新增问题</button></div></div>
    <div class="toolbar"><div class="tabs" role="group" aria-label="筛选题目"><button class="active" data-filter="all">全部题目</button><button data-filter="mine">待我评分 <span id="pending">—</span></button><button data-filter="consensus">三人已评 <span id="complete">0</span></button></div><div class="search-sort"><label class="search"><span aria-hidden="true">⌕</span><span class="sr-only">搜索题目</span><input id="search" type="search" placeholder="搜索题目…"></label><label class="sr-only" for="sort">题目排序</label><select id="sort"><option value="original">默认顺序</option><option value="priority">平均分优先</option><option value="newest">最近新增</option></select></div></div>
    <p class="board-hint"><span id="member-hint">选名字评分</span><span>1分可不问，5分必问</span></p>
    <p id="board-error" class="error board-error" role="alert" hidden></p><div id="table-wrap"><table><thead><tr><th scope="col">候选题目 / 建议问法</th><th scope="col">评分 <span>1–5 分</span></th><th scope="col">平均分</th></tr></thead><tbody id="questions"></tbody></table></div><div id="empty" class="empty" hidden><span>⌕</span><h3>这里暂时没有题目</h3><p>换个关键词或筛选条件，也可以补充一道新问题。</p></div><div class="board-bottom"><span id="showing">正在读取题目…</span></div></section>
  </div>
</main>
<dialog id="editor"><form id="question-form"><div class="dialog-head"><div><h2 id="editor-title">补充一个好问题</h2></div><button type="button" class="icon-button close-dialog" aria-label="关闭新增问题窗口">×</button></div><p id="editing-note" class="form-note">用学员听得懂的话，问一个具体的问题。</p><label for="q-title">题目 <span class="required">*</span></label><textarea id="q-title" rows="2" maxlength="240" required placeholder="例如：你最想让 AI 帮你完成哪件工作？"></textarea><div class="form-columns"><div><label for="q-category">分类</label><select id="q-category"><option>需求</option><option>背景</option><option>障碍</option><option>内容</option><option>预期</option></select></div><div><label for="q-type">建议题型</label><select id="q-type"><option>开放题</option><option>单选</option><option>多选</option></select></div></div><div id="options-field" hidden><label for="q-options">建议选项 <small>每行一个，2–12 项</small></label><textarea id="q-options" rows="4" maxlength="1300" placeholder="选项一&#10;选项二"></textarea></div><label for="q-purpose">为什么想问？ <small>可选，最多 500 字</small></label><textarea id="q-purpose" rows="3" maxlength="500" placeholder="这道题能帮我们了解什么，或决定讲座讲什么？"></textarea><p id="form-error" class="error" role="alert" hidden></p><div id="conflict" hidden><p class="form-note">输入仍在上方。先核对最新题目，再决定是否覆盖。</p><pre id="latest-question"></pre><button type="button" id="rebase" class="quiet">已核对，使用最新版本继续编辑</button></div><div class="dialog-bottom"><span id="author-note"></span><div><button type="button" class="quiet close-dialog">取消</button><button id="save-question" class="primary">添加到讨论表</button></div></div></form></dialog>
<dialog id="share-fallback"><div class="dialog-head"><h2>页面链接</h2><button class="icon-button close-share" aria-label="关闭链接窗口">×</button></div><p>复制此链接给 sam、shaofei 或 zeror。持有链接的人可参与编辑。</p><label class="sr-only" for="share-link">可复制的页面链接</label><input id="share-link" readonly><button class="primary close-share">完成</button></dialog>
<div id="toast" role="status" class="toast" hidden></div>
</body></html>
