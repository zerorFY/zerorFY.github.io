<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paper Learning System - Bilingual MVP</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <div class="brand-mark" aria-hidden="true">PL</div>
        <div>
          <p class="eyebrow">Bilingual JSON MVP</p>
          <h1>Paper Learning System</h1>
        </div>
      </div>
      <div class="topbar-controls">
        <div class="language-switch" role="group" aria-label="Language display mode">
          <button class="language-button is-active" data-language-mode="zh" type="button">中文</button>
          <button class="language-button" data-language-mode="en" type="button">English</button>
          <button class="language-button" data-language-mode="both" type="button">中英对照</button>
        </div>
        <button id="outlineToggle" class="outline-toggle" type="button" aria-expanded="false" aria-controls="sectionList">Outline</button>
        <div class="status-strip" aria-label="System status">
          <span class="status-pill ok">SQL paused</span>
          <span class="status-pill ok">Codex worker</span>
          <span class="status-pill warn">Canonical translation</span>
        </div>
      </div>
    </header>

    <main class="workspace">
      <aside class="rail rail-left" aria-label="Document navigation">
        <section class="panel doc-panel">
          <div class="panel-heading">
            <h2>Document</h2>
            <span id="versionBadge" class="mini-badge">v1</span>
          </div>
          <p id="docTitle" class="doc-title">Loading...</p>
          <div class="metric-grid">
            <div>
              <span id="sectionCount">0</span>
              <label>Sections</label>
            </div>
            <div>
              <span id="segmentCount">0</span>
              <label>Segments</label>
            </div>
            <div>
              <span id="annotationCount">0</span>
              <label>Notes</label>
            </div>
          </div>
          <div class="source-box" aria-label="Loaded data source">
            <div class="source-row">
              <span id="sourceTypeBadge" class="mini-badge">Sample</span>
              <span id="sourcePath">./data/document.sample.json</span>
            </div>
            <button id="importPlaceholder" class="text-button" type="button" disabled>Full paper import pending</button>
          </div>
          <label class="search-box">
            <span>Find</span>
            <input id="segmentSearch" type="search" placeholder="Keyword or segment id">
          </label>
        </section>

        <section class="panel section-panel">
          <div class="panel-heading">
            <h2>Outline</h2>
          </div>
          <nav id="sectionList" class="section-list"></nav>
        </section>

        <section class="panel queue-panel">
          <div class="panel-heading">
            <h2>Worker</h2>
            <button id="clearLocalTasks" class="icon-button" type="button" title="Clear local browser-created tasks" aria-label="Clear local tasks">x</button>
          </div>
          <div id="queueStats" class="queue-stats"></div>
          <div id="taskList" class="task-list"></div>
        </section>
      </aside>

      <button id="outlineScrim" class="outline-scrim" type="button" aria-label="Close outline"></button>

      <section class="reader" aria-label="Paper reader">
        <div class="reader-toolbar">
          <div>
            <p class="eyebrow">Active segment</p>
            <h2 id="activeSegmentTitle">Loading...</h2>
            <p id="loadSummary" class="load-summary">0 sections / 0 segments loaded</p>
          </div>
          <div class="toolbar-actions">
            <button id="prevSegment" class="icon-button" type="button" title="Previous segment" aria-label="Previous segment">&lt;</button>
            <button id="nextSegment" class="icon-button" type="button" title="Next segment" aria-label="Next segment">&gt;</button>
          </div>
        </div>
        <article id="segmentList" class="segment-list"></article>
      </section>

      <aside class="rail rail-right" aria-label="Annotations and questions">
        <section class="panel detail-panel">
          <div class="tabs" role="tablist" aria-label="Detail view">
            <button class="tab is-active" data-tab="annotations" type="button">Notes</button>
            <button class="tab" data-tab="questions" type="button">Q&amp;A</button>
            <button class="tab" data-tab="contract" type="button">Contract</button>
          </div>
          <div id="detailContent" class="detail-content"></div>
        </section>

        <section class="panel ask-panel">
          <div class="panel-heading">
            <h2>Ask</h2>
            <span id="selectedSegmentBadge" class="mini-badge">segment</span>
          </div>
          <form id="questionForm" class="question-form">
            <textarea id="questionInput" rows="4" placeholder="Ask about the active segment"></textarea>
            <div class="form-row">
              <span class="hint">Saved to browser local queue</span>
              <button type="submit">Create task</button>
            </div>
          </form>
        </section>
      </aside>
    </main>

    <nav id="mobileNav" class="mobile-nav" aria-label="Mobile paper tools">
      <button class="mobile-nav-button is-active" data-mobile-panel="body" type="button">正文</button>
      <button class="mobile-nav-button" data-mobile-panel="annotations" type="button">Notes</button>
      <button class="mobile-nav-button" data-mobile-panel="questions" type="button">Q&amp;A</button>
      <button class="mobile-nav-button" data-mobile-panel="ask" type="button">Ask</button>
    </nav>
  </div>

  <template id="emptyTemplate">
    <div class="empty-state">
      <strong>No content</strong>
      <span>Select a segment or create a local task.</span>
    </div>
  </template>

  <script src="./app.js" type="module"></script>
</body>
</html>
